<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猎人手记 · 轻弩</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14110f; --ink2:#1b1714; --ink3:#231e1a; --line:#3a302a; --line2:#4d4037;
  --paper:#e8dcc4; --paper2:#b9ab92; --paper3:#857a68;
  --blood:#b3202a; --blood2:#e0414b; --gold:#d4a54a; --gold2:#f0cf7a; --ok:#7fae7a;
  --serif:"Noto Serif SC","Songti SC",serif; --sans:"Noto Sans SC","PingFang SC",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.65 var(--sans);
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(179,32,42,.16),transparent 60%),
                   radial-gradient(900px 500px at -10% 30%,rgba(212,165,74,.06),transparent 60%);
  background-attachment:fixed}
a{color:var(--gold2)}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.mono{font-family:var(--mono)}
.muted{color:var(--paper3)}
.unv{display:inline-block;font:500 11px/1 var(--sans);color:var(--blood2);border:1px dashed rgba(224,65,75,.6);padding:3px 5px;border-radius:2px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.guess{color:var(--gold);border-color:rgba(212,165,74,.6)}

/* ---------- header ---------- */




.kicker{font:600 12px/1 var(--mono);letter-spacing:.18em;color:var(--blood2);text-transform:uppercase}
h1{font:900 40px/1.15 var(--serif);margin:8px 0 6px;letter-spacing:.02em}
h1 small{font:500 17px var(--serif);color:var(--paper2);margin-left:10px}
.alt{color:var(--paper3);font-size:13px}
.tags{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--paper2)}
.weak{display:flex;gap:14px;align-items:center}
.weak span{display:inline-flex;align-items:center;gap:4px}
.weak img{width:20px;height:20px}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px}
.stars.x{color:var(--paper3)}
.hero-side{text-align:right;font-size:13px;color:var(--paper2)}
.hero-side select{margin-top:6px}







/* ---------- sections ---------- */

.sec-h{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:20px}
.sec-h .no{font:600 13px var(--mono);color:var(--blood2)}
.sec-h h2{font:700 26px/1.2 var(--serif);margin:0}
.sec-h p{margin:0 0 0 auto;color:var(--paper3);font-size:13px;max-width:520px;text-align:right}
.panel{background:var(--ink2);border:1px solid var(--line);border-radius:3px;padding:18px}
.panel h3{font:700 16px var(--serif);margin:0 0 10px;color:var(--paper)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label{font-size:13px;color:var(--paper2)}
select,input[type=number]{background:var(--ink);color:var(--paper);border:1px solid var(--line2);border-radius:2px;padding:5px 7px;font:13px var(--mono)}
input[type=number]{width:80px}
select:focus,input:focus{outline:1px solid var(--blood2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:transparent;color:var(--paper2);border:0;border-right:1px solid var(--line2);padding:7px 12px;font:500 13px var(--sans);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button:last-child{border-right:0}
.seg button img{width:16px;height:16px}
.seg button.on{background:var(--blood);color:#fff}
.seg button:hover:not(.on){background:var(--ink3);color:var(--paper)}
.btn{background:transparent;color:var(--gold2);border:1px solid rgba(212,165,74,.5);border-radius:3px;padding:6px 12px;font:500 13px var(--sans);cursor:pointer}
.btn:hover,.btn:focus-visible{background:rgba(212,165,74,.12);outline:none}
.btn{cursor:pointer}
.btn.on{background:rgba(212,165,74,.16);color:var(--gold2);border-color:var(--gold)}

/* ---------- formula ---------- */
.chain{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:14px 0 4px}
.step{background:var(--ink);border:1px solid var(--line);padding:10px 12px;min-width:104px;border-radius:2px}
.step .t{font-size:12px;color:var(--paper3)}
.step .v{font:600 20px var(--mono);color:var(--paper)}
.step .s{font:11px var(--mono);color:var(--paper3)}
.step.res{border-color:var(--blood);background:rgba(179,32,42,.12)}
.step.res .v{color:var(--gold2)}
.op{display:flex;align-items:center;padding:0 7px;color:var(--blood2);font:600 18px var(--mono)}
.glossary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.glossary div{border-left:2px solid var(--blood);padding:2px 0 2px 10px;font-size:13px;color:var(--paper2)}
.glossary b{display:block;color:var(--paper);font:700 14px var(--serif);margin-bottom:2px}
.formula-line{font:13px var(--mono);color:var(--paper2);background:var(--ink);border:1px dashed var(--line2);padding:10px 12px;margin-top:10px;overflow:auto;white-space:nowrap}
.formula-line em{color:var(--gold2);font-style:normal}

/* ---------- map ---------- */
.mapgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.mapimg{position:relative;width:100%;aspect-ratio:1358/644;background:radial-gradient(60% 70% at 45% 55%,rgba(212,165,74,.10),transparent 70%)}
.mapimg img.render{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6));transition:filter .3s}
.mapimg.st1 img.render,.mapimg.st2 img.render,.mapimg.st3 img.render{filter:drop-shadow(0 0 18px rgba(224,65,75,.45)) drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;border:0;background:none;padding:0;color:#fff}
.hs .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--mono);border:2px solid rgba(12,10,9,.85);box-shadow:0 0 0 2px rgba(232,220,196,.35),0 4px 12px rgba(0,0,0,.6);transition:transform .15s}
.hs .lb{margin-top:3px;font:600 11.5px var(--sans);background:rgba(12,10,9,.78);padding:1px 6px;border-radius:2px;white-space:nowrap}
.hs:hover .dot{transform:scale(1.12)}
.hs.sel .dot{box-shadow:0 0 0 3px var(--gold2),0 0 18px rgba(240,207,122,.6)}
.hs.weak .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(240,207,122,.5),0 0 0 rgba(240,207,122,0)}50%{box-shadow:0 0 0 2px rgba(240,207,122,.9),0 0 16px rgba(240,207,122,.7)}}
.hs.sel.weak .dot{animation:none;box-shadow:0 0 0 3px var(--gold2),0 0 18px rgba(240,207,122,.6)}
.legend{display:flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--paper3);margin-top:8px}
.legend .bar{flex:1;height:8px;border-radius:2px}
.ctrls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font:500 12px var(--sans);color:var(--paper3);border-bottom-color:var(--line2);white-space:nowrap}
td.num{white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr.selrow td{background:rgba(212,165,74,.08)}
.hzcell{font:600 13px var(--mono);text-align:center !important;color:#fff;border:1px solid var(--ink2)}
.hzcell.cur{outline:2px solid var(--gold2);outline-offset:-2px}
.detail .big{font:700 26px var(--serif)}
.detail .row{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 12px;font-size:13px;color:var(--paper2)}
.detail .row b{font-family:var(--mono);color:var(--paper)}
.top3{display:grid;gap:8px}
.top3 .it{display:grid;grid-template-columns:28px 34px 1fr auto;gap:8px;align-items:center;background:var(--ink);border:1px solid var(--line);padding:6px 10px;border-radius:2px}
.top3 .rk{font:700 16px var(--mono);color:var(--blood2)}
.ammoimg{width:28px;height:28px;image-rendering:auto}
.state-note{font-size:12.5px;color:var(--paper3);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}

/* ---------- calc + ranking ---------- */
.calcgrid{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}

.calc .f{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dotted var(--line)}
.calc .f:last-child{border-bottom:0}
.calc .grp{font:600 11px var(--mono);color:var(--blood2);letter-spacing:.12em;margin:12px 0 2px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rank td .barwrap{background:var(--ink);height:8px;border-radius:2px;min-width:90px}
.rank td .barwrap i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blood),var(--gold))}
.rank .nm{display:flex;gap:8px;align-items:center;white-space:nowrap}
.rank .nt{display:block;white-space:normal;margin:2px 0 0 36px}
.rf{white-space:nowrap;font:600 10.5px var(--mono);color:var(--gold2);letter-spacing:.04em}
.noweap td{opacity:.45}
.note-s{font-size:11.5px;color:var(--paper3)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.summary>div{background:var(--ink);border:1px solid var(--line);padding:10px 12px;border-radius:2px}
.summary .t{font-size:12px;color:var(--paper3)}
.summary .v{font:700 18px var(--serif)}
.summary .v .mono{font-size:15px;color:var(--gold2)}

/* ---------- phases ---------- */
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.phase{background:var(--ink2);border:1px solid var(--line);border-top:3px solid var(--c);padding:14px;border-radius:2px}
.phase h4{font:700 18px var(--serif);margin:0 0 2px}
.phase .idx{font:600 11px var(--mono);color:var(--c)}
.phase p{font-size:13px;color:var(--paper2);margin:6px 0}
.phase ul{margin:4px 0 8px;padding-left:18px;font-size:12.5px;color:var(--paper2)}
.phase .lbl{font:600 11px var(--mono);letter-spacing:.1em;color:var(--paper3);margin-top:10px}
.phase .win li{color:var(--gold2)}
.phase .rng{background:var(--ink);border-left:2px solid var(--c);padding:6px 8px;font-size:12.5px;margin-top:8px}
.flow{display:flex;align-items:center;gap:10px;font:12px var(--mono);color:var(--paper3);margin:0 0 14px;flex-wrap:wrap}
.flow b{color:var(--paper);font-family:var(--serif);font-size:14px}
.status-row{display:grid;grid-template-columns:90px 1fr 210px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.status-row .nm{display:flex;gap:8px;align-items:center;font-weight:500}
.status-row img{width:22px;height:22px}
.track{position:relative;height:22px;background:var(--ink);border:1px solid var(--line);border-radius:2px}
.track{height:30px}
.track i{position:absolute;top:0;bottom:0;left:0;border-right:2px solid var(--blood2)}
.track i.t1{background:rgba(179,32,42,.6)} .track i.t2{background:rgba(179,32,42,.32)} .track i.t3{background:rgba(179,32,42,.16)}
.track span{position:absolute;top:7px;font:600 10.5px var(--mono);color:#fff;transform:translateX(calc(-100% - 4px))}

/* ---------- builds ---------- */
.builds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.build{background:var(--ink2);border:1px solid var(--line);padding:16px;border-radius:2px;display:flex;flex-direction:column}
.build h4{font:700 18px var(--serif);margin:0}
.build .w{font-size:12.5px;color:var(--paper3);margin:2px 0 8px}
.build .st{font:12px var(--mono);color:var(--gold2);margin-bottom:8px}
.build .sk{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--paper2);margin-bottom:10px}
.build .sk span::before{content:"◆ ";color:var(--blood);font-size:9px}
.build p{font-size:13px;color:var(--paper2);flex:1}

/* ---------- videos ---------- */
.vgroup{margin-bottom:22px}
.vgroup h3{font:700 16px var(--serif);margin:0 0 10px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vid{display:block;background:var(--ink2);border:1px solid var(--line);border-radius:3px;overflow:hidden;text-decoration:none;color:var(--paper);transition:border-color .15s, transform .15s}
.vid:hover{border-color:var(--blood2);transform:translateY(-2px)}
.vid .th{position:relative;aspect-ratio:16/9;background:#000}
.vid .th img{width:100%;height:100%;object-fit:cover;display:block}
.vid .th .len{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);font:600 11px var(--mono);padding:1px 5px;border-radius:2px}
.vid .th .star{position:absolute;left:6px;top:6px;background:var(--blood);color:#fff;font:700 11px var(--sans);padding:2px 6px;border-radius:2px}
.vid .th .lang{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.8);font:600 11px var(--sans);padding:1px 5px;border-radius:2px}
.vid .bd{padding:9px 11px 11px}
.vid .tt{font:600 13.5px/1.4 var(--sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .ch{font-size:11.5px;color:var(--paper3);margin-top:3px}
.vid .why{font-size:12px;color:var(--gold2);margin-top:5px}
footer{margin-top:50px;border-top:1px solid var(--line);padding:26px 0 50px;font-size:12.5px;color:var(--paper3)}
footer ol{padding-left:18px}
footer li{margin:3px 0}


/* ================= v2 layout (Bellwether 结构 + 游戏配色) ================= */
body{display:block}
.top{position:sticky;top:0;z-index:30;height:58px;display:flex;align-items:center;gap:22px;padding:0 20px;background:rgba(16,13,11,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--paper)}
.top .brand img{width:36px;height:36px;filter:drop-shadow(0 2px 6px rgba(179,32,42,.5))}
.top .brand b{font:900 18px var(--serif);letter-spacing:.02em}
.top .brand b span{color:var(--blood2)}
.top nav{display:flex;gap:4px}
.top nav a{color:var(--paper2);text-decoration:none;font:500 14px var(--sans);padding:7px 11px;border-radius:3px}
.top nav a:hover{background:var(--ink3);color:var(--paper)}
.top nav a.on{color:var(--paper);background:var(--ink3)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--paper3)}
.top .right .hp{font:600 13px var(--mono);color:var(--gold2)}
.shell{display:grid;grid-template-columns:256px 1fr;min-height:calc(100vh - 58px)}
.side{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;border-right:1px solid var(--line);background:rgba(20,17,15,.7);padding:18px 12px 12px;display:flex;flex-direction:column}
.side .brandm{font:700 15px var(--serif);color:var(--paper);margin:0 10px 14px}
.side a.it{position:relative;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 12px;border-radius:3px;color:var(--paper2);text-decoration:none;font:400 14px var(--sans)}
.side a.it:hover{background:rgba(232,220,196,.05);color:var(--paper)}
.side a.it:focus-visible{outline:1px solid var(--gold);outline-offset:-1px}
.side a.it.on{color:var(--gold2);font-weight:600}
.side a.it.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--gold)}
.side .gl{display:flex;align-items:center;gap:8px;margin:14px 2px 4px;padding:7px 10px;border-radius:3px;font:700 13px var(--sans);letter-spacing:.06em;color:var(--paper);cursor:pointer;user-select:none;border:1px solid transparent}
.side .gl:hover{background:rgba(232,220,196,.05);border-color:var(--line)}
.side .gl:focus-visible{outline:1px solid var(--gold)}
.side .gl .chev{display:inline-grid;place-items:center;width:20px;height:20px;color:var(--gold);transition:transform .15s}
.side .gl .chev svg{width:16px;height:16px}
.side .gl.closed .chev{transform:rotate(-90deg)}
.side .gl.closed{background:var(--ink2);border-color:var(--line)}
.side .gl .cnt{margin-left:auto;font:600 11px var(--mono);letter-spacing:0;color:var(--paper2);background:var(--ink3);border:1px solid var(--line2);padding:0 7px;border-radius:9px;line-height:18px}
.side .gl.static{cursor:default;font:600 11px var(--mono);letter-spacing:.14em;color:var(--paper3);padding:4px 10px;margin-top:16px;border:0;background:none}
.side .gl.static:hover{background:none;border-color:transparent}
.side .gl.closed + .sub{display:none}
.side .tree{margin:0 0 4px 22px;border-left:1px solid var(--line2)}
.side .tree a.it{font-size:13px;padding:4px 10px 4px 12px;border-radius:0 3px 3px 0}
.side .tree a.it.on::before{left:-1px;top:3px;bottom:3px}
.side .dotc{width:6px;height:6px;border-radius:50%;flex:none;opacity:.9}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.side .legend2{font-size:11.5px;color:var(--paper3);padding:4px 10px 10px;display:grid;gap:4px}
.side .legend2 i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
main#main{padding:30px 40px 60px;max-width:1180px;width:100%}
.ph{margin-bottom:18px}
.ph .crumb{font:600 12px var(--mono);letter-spacing:.14em;color:var(--blood2);text-transform:uppercase}
.ph h1{font:900 32px/1.2 var(--serif);margin:6px 0 4px}
.ph p{margin:0;color:var(--paper2);font-size:15px}
.key{border:1px solid rgba(212,165,74,.35);border-left:3px solid var(--gold);background:rgba(212,165,74,.06);padding:12px 16px;border-radius:3px;margin:0 0 22px}
.key .t{font:700 12px var(--mono);letter-spacing:.12em;color:var(--gold)}
.key ul{margin:6px 0 0;padding-left:20px;font-size:16px;line-height:1.75}
.key b{color:var(--gold2)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
.pager a{flex:1;max-width:48%;text-decoration:none;border:1px solid var(--line);border-radius:3px;padding:10px 14px;color:var(--paper)}
.pager a:hover{border-color:var(--blood2);background:var(--ink2)}
.pager a .k{font:600 11px var(--mono);color:var(--paper3)}
.pager a.nx{text-align:right;margin-left:auto}
.kbd{font:600 10.5px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;padding:0 5px;border-radius:3px;color:var(--paper3)}

/* home */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:26px}
.tile{display:block;padding:16px 18px;border-right:1px solid var(--line);text-decoration:none;color:var(--paper);position:relative;transition:background .15s}
a.tile:hover,a.tile:focus-visible{background:var(--ink2);outline:none}
a.tile .go{position:absolute;right:14px;top:14px;color:var(--paper3);font-size:14px;transition:transform .15s,color .15s}
a.tile:hover .go{color:var(--gold2);transform:translateX(3px)}
.tile:last-child{border-right:0}
.tile .t{font:600 13px var(--sans);color:var(--blood2)}
.tile .v{font:700 24px/1.3 var(--serif);margin:6px 0 2px}
.tile .v .mono{color:var(--gold2);font-size:20px}
.tile .s{font-size:12.5px;color:var(--paper3)}
h2.h{font:700 20px var(--serif);margin:26px 0 12px;scroll-margin-top:72px}
.secs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.secs a{padding:16px 18px;border-right:1px solid var(--line);text-decoration:none;color:var(--paper)}
.secs a:nth-child(3n){border-right:0}
.secs a:nth-child(n+4){border-top:1px solid var(--line)}
.secs a:hover{background:var(--ink2)}
.secs a .t{font:700 15px var(--sans);color:var(--gold2)}
.secs a .s{font-size:13px;color:var(--paper2);margin-top:4px}
.check{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.check li{list-style:none}
.check a.row{display:flex;gap:12px;align-items:center;background:var(--ink2);border:1px solid var(--line);padding:11px 14px;border-radius:3px;font-size:15px;color:var(--paper);text-decoration:none;transition:border-color .15s,background .15s}
.check a.row:hover,.check a.row:focus-visible{border-color:var(--gold);background:var(--ink3);outline:none}

.check .static{display:flex;gap:12px;align-items:flex-start;padding:6px 2px;font-size:15px}

/* phase pages */
.stabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:18px}
.stabs a{padding:10px 16px;text-decoration:none;color:var(--paper2);font:600 14px var(--sans);border-bottom:2px solid transparent;display:flex;gap:8px;align-items:center}

.hero2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:20px}
.hero2 figure{margin:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#000;position:relative}
.hero2 figure img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.hero2 figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;font-size:12px;color:var(--paper);background:linear-gradient(transparent,rgba(0,0,0,.85))}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.blk{border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--ink2);border-top:3px solid var(--bc)}
.blk .h{font:700 14px var(--sans);color:var(--bc);margin-bottom:4px}
.blk ul{margin:0;padding-left:16px;font-size:14px;line-height:1.7}
.blk b{color:var(--paper)}
.blk.see{--bc:var(--paper2)} .blk.dodge{--bc:var(--blood2)} .blk.hit{--bc:var(--gold)} .blk.stand{--bc:#8fb3d9}

.pill{display:inline-flex;align-items:center;gap:5px;font:600 13px var(--sans);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%}
.pill.yes{color:var(--gold2)} .pill.yes::before{background:var(--gold)}
.pill.no{color:#ff8a90} .pill.no::before{background:var(--blood2)}
.pill.q{color:var(--paper3)} .pill.q::before{background:var(--paper3)}
.bb{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:#ff8a90;margin-left:6px}
.bb img{width:14px;height:14px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.strip div{text-align:center;font-size:12px;color:var(--paper2)}
.strip div b{display:block;font:700 16px var(--mono);color:#fff;padding:6px 0;border-radius:3px;margin-bottom:3px}

/* map page */
.mapgrid{grid-template-columns:1.3fr 1fr}
.map2d{position:relative;width:100%;max-width:400px;margin:0 auto;aspect-ratio:400/520}
.map2d svg{position:absolute;inset:0;width:100%;height:100%}

.map2d .pt:hover{filter:brightness(1.18)}
.map2d .pt.sel{stroke:var(--gold2);stroke-width:2.6}
.map2d .shade{pointer-events:none}
.map2d .horn{stroke:#8a7a68;stroke-width:3.2;fill:none;stroke-linecap:round}
.map2d .hs .dot{width:34px;height:34px;font-size:14px}

/* calc groups */
.calc details{border-bottom:1px solid var(--line);padding:4px 0}
.calc details:last-of-type{border-bottom:0}
.calc summary{cursor:pointer;font:600 12px var(--mono);color:var(--blood2);letter-spacing:.12em;padding:8px 0;list-style:none}
.calc summary::before{content:"▸ ";color:var(--paper3)}

details.more{border:1px solid var(--line);border-radius:3px;padding:8px 12px;margin-top:10px;background:var(--ink2)}

/* followers */
.fol{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.fcard p{margin:0;font-size:14px;color:var(--paper2)}
.tier{float:right;font:700 13px var(--mono);color:var(--ink);background:var(--gold);padding:1px 8px;border-radius:3px}
.tier.a{background:var(--paper3)}


/* 打哪里：地图 + 详情并排，肉质表整行 */

.mapgrid > .panel{padding:14px 16px 12px}

.hzscroll{overflow-x:auto}

table.hzt td.hzcell{height:38px;border-radius:3px;font-size:14px;min-width:56px}

table.hzt td.hzcell.cur{outline:2px solid var(--gold2);outline-offset:-2px;opacity:1}

/* 技能等级步进器 */
.stp{display:flex;align-items:center;gap:6px}

.stp button{width:28px;height:28px;border:1px solid var(--line2);background:var(--ink);color:var(--paper);border-radius:3px;font:600 15px var(--mono);cursor:pointer;line-height:1}

.stp .lv{min-width:34px;text-align:center;font:700 15px var(--mono);color:var(--paper)}
.stp .lv small{font-size:10.5px;color:var(--paper3);font-weight:400}

/* 能做的装备 */
.eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;margin-top:6px}
.eq{display:grid;grid-template-columns:150px 1fr;gap:14px;background:var(--ink2);border:1px solid var(--line);border-radius:3px;padding:12px}

.eqt{font:700 18px var(--serif);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.eqm.sk span{color:var(--gold2);font-size:12.5px}
.ammo{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--paper3);margin-top:6px}
.ammo .rfa{color:var(--gold2)}
.path{font-size:12px;color:var(--paper3);margin-top:6px}
.path.nx{color:var(--paper2)}
.path b{color:#ff8a90}
.eq .src{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--paper3)}
table.pcs{width:100%;margin:4px 0 6px}
table.pcs td{border:0;padding:3px 4px;vertical-align:top;font-size:13.5px}
table.pcs td:first-child{width:32px}

@media (max-width:760px){ .eqs{grid-template-columns:1fr} .eq,.eq.arm{grid-template-columns:96px 1fr} }
/* ================= v3：多怪物 ================= */

.top nav a.mon{display:inline-flex;align-items:center;gap:6px;color:var(--gold2)}
.top nav a.mon img{width:22px;height:22px}
